# XcodeGen spec for the app shell.
#
# The .xcodeproj is generated, not committed: this file is the source of truth, it
# diffs readably, and there is no project file to resolve merge conflicts in.
#
#   xcodegen generate --spec App/project.yml
#
# All the logic lives in the SwiftPM package at the repo root. This target is the
# window and nothing else.
name: HipparchusMac
options:
  bundleIdPrefix: com.hipparchus
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  # The spec sits in App/, the package sits at the repo root.
  minimumXcodeGenVersion: "2.38"

packages:
  HipparchusMac:
    path: ..

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  HipparchusMac:
    type: application
    platform: macOS
    sources:
      - path: HipparchusApp
    dependencies:
      - package: HipparchusMac
        product: HipparchusRender
      - package: HipparchusMac
        product: HipparchusData
      - package: HipparchusMac
        product: HipparchusGeometry
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hipparchus.HipparchusMac
        # Modest on purpose: the model behind the window is well tested, and the
        # window itself has never been reviewed by anyone. A minor bump here
        # marks a layer the application never had — relief shading at 0.2.0, the
        # sea at 0.3.0 — and never a milestone in confidence. The patches after
        # it are that sea getting honest: 0.3.1 put real bathymetry under it,
        # 0.3.2 said how much of that floor anybody had surveyed, and 0.3.3 says
        # on the sheet itself that none of it is a chart.
        #
        # 0.4.0 is a minor rather than a patch because the sea stopped being a
        # coastline with depths under it. One ERDDAP client reaches a federated
        # network of ocean data, and the currents are integrated into
        # streamlines — a drawn flow field, which no amount of patching the
        # bathymetry would have produced.
        #
        # `CURRENT_PROJECT_VERSION` is the only number here that must be
        # monotonic. `make-dmg.sh` reads the version out of the built Info.plist,
        # so this file is the one place it is stated.
        # 0.4.1 is a patch, and the honest kind: it adds no layer. What it fixes
        # is that 0.4.0 shipped four marine sources whose credits had never been
        # written down, and exports that carried no attribution at all despite
        # the About panel promising they did.
        # 0.4.2 is the first release with any automated check on the window at
        # all, and the first to fix something those checks found: whether the
        # Locator opened at launch was a coin toss, and anybody who turned the
        # splash off was living with it.
        # 0.4.3 changes nothing a user of this build can see: it repairs the
        # signing path, which only runs once a Developer ID certificate exists.
        # It is cut anyway so that the first notarised image is built by a
        # released version rather than by whatever happened to be on `main`.
        # 0.4.4 is four fixes to how the sea is drawn, and every one of them was
        # found by rendering a sheet and looking at it rather than by a test.
        # Two are the same inverted depth ramp in two copies of one formula.
        # 0.4.5 is three fixes and one export path, no new layer. The seven
        # newest palettes ship as an installable plugin pack now — `--palette`
        # already reached all seventeen, so this is Style → Plugins catching up
        # rather than a capability the app lacked. Coronelli's own ink sat a few
        # units from its own water, so its coastline read as barely more than
        # the sea around it. And the window's title, cleared in 0.4.4 to
        # declutter the toolbar, is real again without bringing the clutter
        # back — fixing that once cost a second, launch-order regression before
        # it held, caught only by running the layout tests twice rather than
        # once.
        # 0.4.6 changes nothing a user of the app can see: the README stopped
        # calling the Python "the specification" — stale since the sea started
        # flowing the other way — and its test count, download link and build
        # example caught up to 0.4.5.
        MARKETING_VERSION: "0.4.6"
        CURRENT_PROJECT_VERSION: "17"
        PRODUCT_NAME: Hipparchus
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_CFBundleDisplayName: Hipparchus
        # A document-less app: the window is the app.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.graphics-design
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: HipparchusApp/Hipparchus.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES

  # The layout tests.
  #
  # **These open real windows on whoever's desktop runs them**, because that is
  # what XCUITest is — it launches the application and drives it. That makes them
  # unlike every other test here, and it is why they are a separate target with a
  # scheme of their own rather than something `swift test` can reach. Nothing
  # runs them by accident.
  #
  #   bash Scripts/ui-test.sh
  #
  # is the only way in, and it says what it is about to do before it does it.
  HipparchusUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: HipparchusUITests
    dependencies:
      - target: HipparchusMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hipparchus.HipparchusUITests
        TEST_TARGET_NAME: HipparchusMac
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        # XCUITest's own API is not Sendable-clean, and the strictness that is
        # right for the model would be noise here.
        SWIFT_STRICT_CONCURRENCY: minimal

schemes:
  # The application, with the layout tests deliberately *not* attached. Building
  # or running the app must never start opening windows and driving them.
  HipparchusMac:
    build:
      targets:
        HipparchusMac: all
    run:
      config: Debug
    archive:
      config: Release

  # The layout tests, on a scheme of their own so that reaching them is a
  # decision. `xcodebuild test -scheme HipparchusMac` finds nothing to run.
  HipparchusUITests:
    build:
      targets:
        HipparchusMac: all
        HipparchusUITests: [test]
    test:
      config: Debug
      targets:
        - HipparchusUITests
