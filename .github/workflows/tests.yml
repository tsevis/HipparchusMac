name: Tests

# The headless suite: everything that can be checked without a window.
#
# This is the cheap half and it runs on every push. The other half — the
# XCUITest bundle, which opens real windows — is a separate workflow that only
# runs when asked. See ui-tests.yml for why.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  headless:
    name: swift test
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # Printed rather than pinned. The package is swift-tools-version 6.0 and
      # targets macOS 15, so the runner's default Xcode should serve; if a
      # future image moves past what this builds against, this line is where
      # you will see it first, and `sudo xcode-select -s` is the fix.
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      # GEOS is a committed binary target — Vendor/geos/geos.xcframework — so
      # there is nothing to compile from source here and no Homebrew step.
      - name: Build tests
        run: swift build --build-tests

      - name: Run tests
        run: swift test

      # Two facts about every commit that nothing used to check, and both went
      # stale. The count in the README is derived from `swift test --list-tests`
      # rather than typed, and drifted three times in one day before it was; the
      # preset tables are generated from the Python, and had been emitting three
      # geometry fields this package's model does not have, so the next person to
      # regenerate them would have got Swift that does not compile.
      #
      # Neither check writes anything. Both fail loudly instead.
      - name: Test count in the README is current
        run: Scripts/update-test-count.sh --check

      - name: Check out the Python
        uses: actions/checkout@v4
        with:
          repository: tsevis/Hipparchus
          path: .python-twin

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Preset tables match the Python
        env:
          HIPPARCHUS_PYTHON_REPO: ${{ github.workspace }}/.python-twin
        run: |
          python -m pip install --upgrade pip
          # Shapely only, which brings numpy with it. The generator reads the
          # registry through the Python's own `rendering.models`, and that module
          # imports `shapely.geometry.base` for its geometry types — but nothing
          # here draws, so skia and scipy are not needed.
          python -m pip install shapely
          python3 Scripts/generate-presets.py --check
